name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Each job gets only the permissions its own steps need: the tests and the
# toolchain never run with the npm publishing identity or a write token.
# Third-party actions are pinned by commit SHA.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Validate release tag matches package version
        run: node packages/forgeframe/scripts/check-release-tag.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run release checks
        run: npm run release:check

      - name: Run browser suite
        run: npm run test:browser

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/forgeframe/playwright-report
            packages/forgeframe/test-results
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # A pre-release (2.0.0-beta.1) publishes to `next`; a final release to `latest`.
      - name: Choose npm dist-tag
        id: dist-tag
        run: node packages/forgeframe/scripts/release-dist-tag.mjs >> "$GITHUB_OUTPUT"

      # The publish job uploads this tarball, packed from the verified checkout.
      # npm pack does not create its destination directory.
      - name: Pack the package
        run: mkdir -p release && npm pack -w forgeframe --pack-destination release

      - name: Upload the package tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Authenticate to npm through trusted publishing and sign provenance.
      id-token: write

    steps:
      - name: Download the package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: release

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@11.21.1

      # Publishing a tarball runs no package scripts; the verify job ran them.
      - name: Publish to npm with provenance
        run: npm publish ./release/*.tgz --provenance --tag ${{ needs.verify.outputs.dist-tag }}

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Create the GitHub release.
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.dist-tag == 'next' }}
