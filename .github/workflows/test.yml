name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Type, lint, size, audit, and package-content checks give the same result
      # on every Node version, so only the Node 24 leg runs them.
      - name: Run type check
        if: matrix.node-version == 24
        run: npm run typecheck

      - name: Run Biome checks
        if: matrix.node-version == 24
        run: npm run check:ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Check bundle size and validate published types
        if: matrix.node-version == 24
        run: npm run size && npm run typecheck:package

      - name: Build playground
        run: npm run build:playground

      - name: Install and validate packed package
        run: npm run test:package

      - name: Audit dependency tree
        if: matrix.node-version == 24
        run: npm audit

      - name: Validate package contents
        if: matrix.node-version == 24
        run: npm pack --dry-run -w forgeframe

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image ships the browsers and their system libraries for the pinned
    # @playwright/test version, so no apt install runs here. Keep its tag in
    # step with package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Firefox refuses to start as root when HOME belongs to another user.
      # Actions sets HOME=/github/home for container steps, overriding the
      # container's env, so set it on the step.
      - name: Run browser suite
        run: npm run test:browser
        env:
          HOME: /root

      # Traces, screenshots and videos of failed browser tests, kept for a week.
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/forgeframe/playwright-report
            packages/forgeframe/test-results
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
