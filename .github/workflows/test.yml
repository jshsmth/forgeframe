name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type, lint, size, audit, and package-content checks give the same result
      # on every Node version, so only the Node 24 leg runs them.
      - name: Run type check
        if: matrix.node-version == 24
        run: npm run typecheck

      - name: Run Biome checks
        if: matrix.node-version == 24
        run: npm run check:ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Install browser engines
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser navigation regressions
        if: matrix.node-version == 24
        run: npm run test:browser

      - name: Build library
        run: npm run build

      - name: Check bundle size and validate published types
        if: matrix.node-version == 24
        run: npm run size && npm run typecheck:package

      - name: Build playground
        run: npm run build:playground

      - name: Install and validate packed package
        run: npm run test:package

      - name: Audit dependency tree
        if: matrix.node-version == 24
        run: npm audit

      - name: Validate package contents
        if: matrix.node-version == 24
        run: npm pack --dry-run -w forgeframe

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.node-version == 24
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
